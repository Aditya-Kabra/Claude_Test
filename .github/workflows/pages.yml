name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires a one-time setup: Settings -> Pages -> Source: "GitHub Actions".
      # GITHUB_TOKEN can deploy to Pages but cannot create the Pages site itself
      # (that endpoint needs admin rights), so enablement:true does not work here.
      - uses: actions/configure-pages@v5

      # The site is a single static index.html at the repo root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
