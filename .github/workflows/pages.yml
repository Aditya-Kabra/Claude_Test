name: Deploy to GitHub Pages

# The github-pages environment only accepts deployments from the repository's
# default branch. Both branches are listed so this deploys whichever one that
# is, and keeps working if the default is later switched to main.
on:
  push:
    branches: [main, claude/smart-fabrics-use-cases-map-9armod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish rather than cancelling it partway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Requires a one-time setup: Settings -> Pages -> Source: "GitHub Actions".
      # GITHUB_TOKEN can deploy to Pages but cannot create the Pages site itself
      # (that endpoint needs admin rights), so enablement:true does not work here.
      - uses: actions/configure-pages@v5

      # The site is a single static index.html at the repo root.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
